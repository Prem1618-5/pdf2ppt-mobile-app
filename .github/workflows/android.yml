name: Android

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests + APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python tools for the deck validator
        run: pip install python-pptx pymupdf pillow
      - name: LibreOffice + Arial-metric fonts (rendered text-fit check of the decks)
        # optional: without LibreOffice the deck tests still validate structure, only the rendered check is skipped
        continue-on-error: true
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -q -o Acquire::Retries=3
          sudo apt-get install -y -q --no-install-recommends -o Dpkg::Options::=--force-confold libreoffice-impress fonts-liberation2
      - name: Unit tests (pure Kotlin domain, fixtures, PPTX validator) and debug APK
        run: ./gradlew :core:test testDebugUnitTest assembleDebug --stacktrace
      - name: Validate the generated 30-question decks (both layouts)
        run: |
          python handoff/tools/validate_pptx.py core/build/test-out/e2e_top.pptx --layout top --expect-questions 30
          python handoff/tools/validate_pptx.py core/build/test-out/e2e_top_right.pptx --layout top-right --expect-questions 30
      - name: Security sweep (B14)
        run: scripts/security_sweep.sh app/build/outputs/apk/debug/PaperToSlides-v*-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: PaperToSlides-debug-apk
          path: app/build/outputs/apk/debug/PaperToSlides-v*-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            core/build/test-out/*.pptx
            core/build/test-out/*.json
            core/build/test-out/*.txt

  emulator:
    name: Self-test on an emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the on-device self-test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb logcat -c
            ./gradlew connectedDebugAndroidTest -PwithX86 -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --stacktrace || (adb logcat -d -s SelfTest:I AndroidRuntime:E TestRunner:* > selftest.log; mkdir -p screens; adb exec-out run-as app.papertoslides tar c files/screens > screens/screens.tar; exit 1)
            adb logcat -d -s SelfTest:I > selftest.log
            mkdir -p screens; adb exec-out run-as app.papertoslides tar c files/screens > screens/screens.tar || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-self-test
          path: |
            selftest.log
            screens
            app/build/reports/androidTests
